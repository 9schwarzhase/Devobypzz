<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEVOBYPZZ | Audio Studio</title>
    <style>
        /* CSS: PENGATURAN WARNA & GAYA MONOKROM */
        :root {
            --bg-color: #0a0a0a;
            --sidebar-bg: #000000;
            --panel-bg: #121212;
            --border-color: #2a2a2a;
            --text-main: #ffffff;
            --text-dim: #888888;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR KIRI */
        .sidebar {
            width: 250px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 50px;
            text-transform: uppercase;
        }

        .menu-item {
            padding: 15px;
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 10px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .menu-item.active, .menu-item:hover {
            background-color: var(--panel-bg);
            color: var(--text-main);
        }

        /* AREA UTAMA (KANAN) */
        .main-content {
            flex: 1;
            padding: 50px;
            max-width: 1200px;
        }

        .header-title {
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        /* PANEL GAYA DATAR */
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        /* AREA UPLOAD */
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .upload-area:hover {
            border-color: var(--text-dim);
        }

        /* GRID EQUALIZER */
        .eq-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
        }

        /* STYLING SLIDER (Monokrom) */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            margin-top: -6px;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: var(--border-color);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="brand">DEVOBYPZZ<br><span style="font-size: 10px; color: var(--text-dim); letter-spacing: 1px;">STUDIO BYPASS</span></div>
        <a href="#" class="menu-item">Dashboard</a>
        <a href="#" class="menu-item active">Audio Editor</a>
        <a href="#" class="menu-item">Presets</a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="header-title">Welcome Back</div>
        <h1>START YOUR MIX</h1>

        <!-- PANEL UPLOAD -->
        <div class="panel">
            <h2 style="font-size: 14px; letter-spacing: 1.5px; margin-bottom: 20px;">STEP 01 - UPLOAD AUDIO</h2>
            <div class="upload-area">
                <p style="font-weight: bold; margin-bottom: 10px;">DROP YOUR AUDIO HERE</p>
                <p style="font-size: 12px; color: var(--text-dim);">or click to browse (MP3, WAV, FLAC)</p>
                <input type="file" id="audio-upload" style="display: none;" multiple accept="audio/*">
            </div>
        </div>

        <!-- PANEL EQUALIZER -->
        <div class="panel">
            <h2 style="font-size: 14px; letter-spacing: 1.5px; margin-bottom: 30px;">CORE CONTROLS (EQUALIZER)</h2>
            <div class="eq-grid">
                <!-- Kolom Kiri -->
                <div class="control-group">
                    <label>BASS <span>0 dB</span></label>
                    <input type="range" min="-12" max="12" value="0" id="bass-slider">
                </div>
                <!-- Kolom Kanan -->
                <div class="control-group">
                    <label>TREBLE <span>0 dB</span></label>
                    <input type="range" min="-12" max="12" value="0" id="treble-slider">
                </div>
                <div class="control-group">
                    <label>PITCH <span>0 ST</span></label>
                    <input type="range" min="-12" max="12" value="0" id="pitch-slider">
                </div>
                <div class="control-group">
                    <label>SPEED <span>1.0x</span></label>
                    <input type="range" min="0.5" max="2" value="1" step="0.1" id="speed-slider">
                </div>
            </div>
        </div>

    </div>

    <script>
        // Nanti kode logika pemrosesan suara JavaScript-nya kita taruh di sini!
        // Untuk sekarang, kita buat area upload bisa diklik
        const uploadArea = document.querySelector('.upload-area');
        const fileInput = document.getElementById('audio-upload');

        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });
    </script>
</body>
</html>
