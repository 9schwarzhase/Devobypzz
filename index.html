<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEVOBYPZZ | Audio Studio</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --sidebar-bg: #000000;
            --panel-bg: #121212;
            --border-color: #2a2a2a;
            --text-main: #ffffff;
            --text-dim: #888888;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 50px;
            text-transform: uppercase;
        }

        .menu-item {
            padding: 15px;
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 10px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .menu-item.active, .menu-item:hover {
            background-color: var(--panel-bg);
            color: var(--text-main);
        }

        .main-content {
            flex: 1;
            padding: 50px;
            max-width: 1200px;
        }

        .header-title {
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .upload-area:hover {
            border-color: var(--text-dim);
        }

        audio {
            width: 100%;
            margin-top: 20px;
            outline: none;
        }

        canvas {
            width: 100%;
            height: 150px;
            background-color: var(--bg-color); 
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 30px;
            display: block;
        }

        .eq-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px 30px; /* Jarak vertikal 25px, horizontal 30px */
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .vol-control {
            grid-column: 1 / -1;
            margin-top: 10px;
        }

        .control-group label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            margin-top: -6px;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: var(--border-color);
            border-radius: 2px;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .preset-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .preset-btn:hover {
            background-color: var(--border-color);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">DEVOBYPZZ<br><span style="font-size: 10px; color: var(--text-dim); letter-spacing: 1px;">STUDIO BYPASS</span></div>
        <a href="#" class="menu-item">Dashboard</a>
        <a href="#" class="menu-item active">Audio Editor</a>
        <a href="#" class="menu-item">Presets</a>
    </div>

    <div class="main-content">
        <div class="header-title">Welcome Back</div>
        <h1>START YOUR MIX</h1>

        <div class="panel">
            <h2 style="font-size: 14px; letter-spacing: 1.5px; margin-bottom: 20px;">STEP 01 - UPLOAD AUDIO</h2>
            <div class="upload-area">
                <p style="font-weight: bold; margin-bottom: 10px;">DROP YOUR AUDIO HERE</p>
                <p style="font-size: 12px; color: var(--text-dim);">or click to browse</p>
                <input type="file" id="audio-upload" style="display: none;" accept="audio/*">
            </div>
            <div id="player-container" style="display: none;">
                <audio id="audio-player" controls></audio>
            </div>
        </div>

        <div class="panel">
            <h2 style="font-size: 14px; letter-spacing: 1.5px; margin-bottom: 30px;">CORE CONTROLS (PRO FX)</h2>
            <canvas id="waveform"></canvas>
            
            <div class="eq-grid">
                <!-- Baris 1: Dasar -->
                <div class="control-group">
                    <label>SPEED <span id="speed-val">1.0x</span></label>
                    <input type="range" min="0.5" max="2" value="1" step="0.1" id="speed-slider">
                </div>
                <div class="control-group">
                    <label>PITCH (Soon) <span id="pitch-val">0 ST</span></label>
                    <input type="range" min="-12" max="12" value="0" id="pitch-slider">
                </div>
                
                <!-- Baris 2: Equalizer Dasar -->
                <div class="control-group">
                    <label>BASS <span id="bass-val">0 dB</span></label>
                    <input type="range" min="-15" max="15" value="0" id="bass-slider">
                </div>
                <div class="control-group">
                    <label>MID <span id="mid-val">0 dB</span></label>
                    <input type="range" min="-15" max="15" value="0" id="mid-slider">
                </div>
                
                <!-- Baris 3: Equalizer & Ruang -->
                <div class="control-group">
                    <label>TREBLE <span id="treble-val">0 dB</span></label>
                    <input type="range" min="-15" max="15" value="0" id="treble-slider">
                </div>
                <div class="control-group">
                    <label>REVERB (GEMA) <span id="reverb-val">0%</span></label>
                    <input type="range" min="0" max="100" value="0" id="reverb-slider">
                </div>

                <!-- Baris 4: Dimensi & Pantulan -->
                <div class="control-group">
                    <label>PANNING (L/R) <span id="pan-val">CENTER</span></label>
                    <input type="range" min="-1" max="1" value="0" step="0.1" id="pan-slider">
                </div>
                <div class="control-group">
                    <label>DELAY (PANTULAN) <span id="delay-val">0%</span></label>
                    <input type="range" min="0" max="100" value="0" id="delay-slider">
                </div>

                <!-- Baris 5: Distorsi & Filter -->
                <div class="control-group">
                    <label>DISTORTION <span id="dist-val">0%</span></label>
                    <input type="range" min="0" max="100" value="0" id="dist-slider">
                </div>
                <div class="control-group">
                    <label>MUFFLE (LOW-PASS) <span id="muffle-val">0%</span></label>
                    <input type="range" min="0" max="100" value="0" id="muffle-slider">
                </div>

                <!-- Baris 6: Volume Master -->
                <div class="control-group vol-control">
                    <label>MASTER VOLUME <span id="volume-val">100%</span></label>
                    <input type="range" min="0" max="200" value="100" id="volume-slider">
                </div>
            </div>
        </div>

        <div class="panel">
            <h2 style="font-size: 14px; letter-spacing: 1.5px; margin-bottom: 20px;">QUICK PRESETS</h2>
            <div class="preset-grid">
                <button class="preset-btn" data-preset="clean">Clean Upload</button>
                <button class="preset-btn" data-preset="lofi">Lo-Fi Radio</button>
                <button class="preset-btn" data-preset="8d">8D Concert</button>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('audio-upload');
        const uploadArea = document.querySelector('.upload-area');
        const audioPlayer = document.getElementById('audio-player');
        const playerContainer = document.getElementById('player-container');

        // Menangkap semua slider
        const speedSlider = document.getElementById('speed-slider');
        const pitchSlider = document.getElementById('pitch-slider'); 
        const bassSlider = document.getElementById('bass-slider');
        const midSlider = document.getElementById('mid-slider');
        const trebleSlider = document.getElementById('treble-slider');
        const reverbSlider = document.getElementById('reverb-slider');
        const panSlider = document.getElementById('pan-slider');
        const delaySlider = document.getElementById('delay-slider');
        const distSlider = document.getElementById('dist-slider');
        const muffleSlider = document.getElementById('muffle-slider');
        const volumeSlider = document.getElementById('volume-slider');

        const canvas = document.getElementById('waveform');
        const canvasCtx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        let audioCtx, source, analyser, bufferLength, dataArray;
        let bassFilter, midFilter, trebleFilter, volumeNode;
        let convolver, wetGain, dryGain;
        let pannerNode, delayNode, delayMixGain, delayFeedback, distNode, muffleFilter;

        uploadArea.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                audioPlayer.src = fileURL;
                playerContainer.style.display = 'block';
                setupWebAudio();
            }
        });

        function createReverbBuffer(ctx) {
            const length = ctx.sampleRate * 2.5;
            const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
            const left = impulse.getChannelData(0);
            const right = impulse.getChannelData(1);
            for (let i = 0; i < length; i++) {
                const decay = Math.exp(-i / (ctx.sampleRate * 0.5));
                left[i] = (Math.random() * 2 - 1) * decay;
                right[i] = (Math.random() * 2 - 1) * decay;
            }
            return impulse;
        }

        // Fungsi matematika untuk merusak/mendistorsi gelombang suara
        function makeDistortionCurve(amount) {
            if (amount === 0) return new Float32Array([0, 0]); // Bypass
            const k = amount;
            const n_samples = 44100;
            const curve = new Float32Array(n_samples);
            const deg = Math.PI / 180;
            for (let i = 0; i < n_samples; ++i) {
                const x = i * 2 / n_samples - 1;
                curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
            }
            return curve;
        }

        function setupWebAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                source = audioCtx.createMediaElementSource(audioPlayer);
                
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                // Inisialisasi Filter Baru
                muffleFilter = audioCtx.createBiquadFilter();
                muffleFilter.type = 'lowpass';
                muffleFilter.frequency.value = 22050; // Awalnya terbuka penuh (tidak diredam)

                distNode = audioCtx.createWaveShaper();
                distNode.curve = makeDistortionCurve(0);
                distNode.oversample = '4x';

                pannerNode = audioCtx.createStereoPanner();
                pannerNode.pan.value = 0;

                // Setup Delay
                delayNode = audioCtx.createDelay();
                delayNode.delayTime.value = 0.4; // Jeda pantulan 400ms
                delayFeedback = audioCtx.createGain();
                delayFeedback.gain.value = 0.4; // Panjangnya pantulan (feedback)
                delayMixGain = audioCtx.createGain();
                delayMixGain.gain.value = 0; // Volume delay awal (Mati)

                // Setup EQ Dasar
                bassFilter = audioCtx.createBiquadFilter(); 
                bassFilter.type = 'lowshelf'; 
                bassFilter.frequency.value = 150;
                midFilter = audioCtx.createBiquadFilter(); 
                midFilter.type = 'peaking'; 
                midFilter.frequency.value = 1000;
                trebleFilter = audioCtx.createBiquadFilter(); 
                trebleFilter.type = 'highshelf'; 
                trebleFilter.frequency.value = 4000;

                // Setup Reverb & Master Volume
                convolver = audioCtx.createConvolver();
                convolver.buffer = createReverbBuffer(audioCtx);
                dryGain = audioCtx.createGain();
                wetGain = audioCtx.createGain();
                wetGain.gain.value = 0; 
                volumeNode = audioCtx.createGain();

                // --------------------------------------------------
                // ARSITEKTUR KABEL (ROUTING SIGNAL)
                // --------------------------------------------------
                // Rantai Linier: Source -> Muffle -> Distorsi -> EQ -> Panning
                source.connect(muffleFilter);
                muffleFilter.connect(distNode);
                distNode.connect(bassFilter);
                bassFilter.connect(midFilter);
                midFilter.connect(trebleFilter);
                trebleFilter.connect(pannerNode);

                // Memecah Sinyal dari Panner ke 3 Jalur: Suara Asli, Gema, dan Pantulan
                pannerNode.connect(dryGain);
                pannerNode.connect(wetGain);
                pannerNode.connect(delayNode);
                
                // Jalur Gema (Reverb)
                wetGain.connect(convolver);
                
                // Jalur Pantulan (Delay)
                delayNode.connect(delayFeedback);
                delayFeedback.connect(delayNode); // Looping pantulan
                delayNode.connect(delayMixGain);
                
                // Menggabungkan kembali 3 jalur ke Master Volume
                dryGain.connect(volumeNode);
                convolver.connect(volumeNode);
                delayMixGain.connect(volumeNode);

                // Visualisasi & Speaker
                volumeNode.connect(analyser);
                analyser.connect(audioCtx.destination);

                drawWaveform();
            }
        }

        function drawWaveform() {
            requestAnimationFrame(drawWaveform);
            analyser.getByteTimeDomainData(dataArray);

            canvasCtx.fillStyle = '#0a0a0a';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#ffffff';
            canvasCtx.beginPath();

            const sliceWidth = canvas.width * 1.0 / bufferLength;
            let x = 0;
            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * canvas.height / 2;
                if (i === 0) canvasCtx.moveTo(x, y);
                else canvasCtx.lineTo(x, y);
                x += sliceWidth;
            }
            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.stroke();
        }

        // --- EVENT LISTENERS SLIDER LAMA ---
        speedSlider.addEventListener('input', (e) => {
            audioPlayer.playbackRate = e.target.value;
            document.getElementById('speed-val').innerText = e.target.value + 'x';
        });
        pitchSlider.addEventListener('input', (e) => {
            document.getElementById('pitch-val').innerText = e.target.value + ' ST';
        });
        bassSlider.addEventListener('input', (e) => {
            if (bassFilter) bassFilter.gain.value = e.target.value;
            document.getElementById('bass-val').innerText = e.target.value + ' dB';
        });
        midSlider.addEventListener('input', (e) => {
            if (midFilter) midFilter.gain.value = e.target.value;
            document.getElementById('mid-val').innerText = e.target.value + ' dB';
        });
        trebleSlider.addEventListener('input', (e) => {
            if (trebleFilter) trebleFilter.gain.value = e.target.value;
            document.getElementById('treble-val').innerText = e.target.value + ' dB';
        });
        reverbSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            if (wetGain && dryGain) {
                wetGain.gain.value = val / 100;
                dryGain.gain.value = 1 - (val / 200);
            }
            document.getElementById('reverb-val').innerText = val + '%';
        });
        volumeSlider.addEventListener('input', (e) => {
            if (volumeNode) volumeNode.gain.value = e.target.value / 100;
            document.getElementById('volume-val').innerText = e.target.value + '%';
        });

        // --- EVENT LISTENERS SLIDER BARU ---
        panSlider.addEventListener('input', (e) => {
            if (pannerNode) pannerNode.pan.value = e.target.value;
            let label = 'CENTER';
            if (e.target.value < 0) label = 'LEFT ' + Math.abs(e.target.value * 100).toFixed(0) + '%';
            if (e.target.value > 0) label = 'RIGHT ' + (e.target.value * 100).toFixed(0) + '%';
            document.getElementById('pan-val').innerText = label;
        });

        delaySlider.addEventListener('input', (e) => {
            if (delayMixGain) delayMixGain.gain.value = e.target.value / 100;
            document.getElementById('delay-val').innerText = e.target.value + '%';
        });

        distSlider.addEventListener('input', (e) => {
            if (distNode) {
                // Konversi 0-100 menjadi nilai distorsi matematika yang ekstrim
                const amount = parseInt(e.target.value) * 5; 
                distNode.curve = makeDistortionCurve(amount);
            }
            document.getElementById('dist-val').innerText = e.target.value + '%';
        });

        muffleSlider.addEventListener('input', (e) => {
            if (muffleFilter) {
                // Menghitung logaritma frekuensi dari 22050Hz (terbuka) turun ke 300Hz (sangat teredam)
                const val = e.target.value / 100;
                const minFreq = 300;
                const maxFreq = 22050;
                muffleFilter.frequency.value = maxFreq * Math.pow(minFreq / maxFreq, val);
            }
            document.getElementById('muffle-val').innerText = e.target.value + '%';
        });

        // PRESET DATA DIPERBARUI UNTUK MENDUKUNG FX BARU
        const presetsData = {
            'clean': { speed: 1.0, bass: 0, mid: 0, treble: 0, reverb: 0, pan: 0, delay: 0, dist: 0, muffle: 0, volume: 100 },
            'lofi': { speed: 0.9, bass: 6, mid: 4, treble: -8, reverb: 15, pan: 0, delay: 0, dist: 15, muffle: 60, volume: 110 },
            '8d': { speed: 1.0, bass: 10, mid: 0, treble: 4, reverb: 40, pan: -0.5, delay: 30, dist: 0, muffle: 10, volume: 90 }
        };

        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const p = presetsData[e.target.getAttribute('data-preset')];
                
                speedSlider.value = p.speed;
                bassSlider.value = p.bass;
                midSlider.value = p.mid;
                trebleSlider.value = p.treble;
                reverbSlider.value = p.reverb;
                panSlider.value = p.pan;
                delaySlider.value = p.delay;
                distSlider.value = p.dist;
                muffleSlider.value = p.muffle;
                volumeSlider.value = p.volume;

                [speedSlider, bassSlider, midSlider, trebleSlider, reverbSlider, panSlider, delaySlider, distSlider, muffleSlider, volumeSlider].forEach(slider => {
                    slider.dispatchEvent(new Event('input'));
                });
            });
        });
    </script>
</body>
</html>
