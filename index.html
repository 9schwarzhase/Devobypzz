<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEVOBYPZZ | Audio Studio</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --sidebar-bg: #000000;
            --panel-bg: #121212;
            --border-color: #2a2a2a;
            --text-main: #ffffff;
            --text-dim: #888888;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 50px;
            text-transform: uppercase;
        }

        .menu-item {
            padding: 15px;
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 10px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .menu-item.active, .menu-item:hover {
            background-color: var(--panel-bg);
            color: var(--text-main);
        }

        .main-content {
            flex: 1;
            padding: 50px;
            max-width: 1200px;
        }

        .header-title {
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .upload-area:hover {
            border-color: var(--text-dim);
        }

        /* Styling Audio Player bawaan */
        audio {
            width: 100%;
            margin-top: 20px;
            outline: none;
        }

        .eq-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            margin-top: -6px;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: var(--border-color);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">DEVOBYPZZ<br><span style="font-size: 10px; color: var(--text-dim); letter-spacing: 1px;">STUDIO BYPASS</span></div>
        <a href="#" class="menu-item">Dashboard</a>
        <a href="#" class="menu-item active">Audio Editor</a>
        <a href="#" class="menu-item">Presets</a>
    </div>

    <div class="main-content">
        <div class="header-title">Welcome Back</div>
        <h1>START YOUR MIX</h1>

        <div class="panel">
            <h2 style="font-size: 14px; letter-spacing: 1.5px; margin-bottom: 20px;">STEP 01 - UPLOAD AUDIO</h2>
            <div class="upload-area">
                <p style="font-weight: bold; margin-bottom: 10px;">DROP YOUR AUDIO HERE</p>
                <p style="font-size: 12px; color: var(--text-dim);">or click to browse</p>
                <input type="file" id="audio-upload" style="display: none;" accept="audio/*">
            </div>
            
            <!-- Elemen Audio Player yang baru ditambahkan -->
            <div id="player-container" style="display: none;">
                <audio id="audio-player" controls></audio>
            </div>
        </div>

        <div class="panel">
            <h2 style="font-size: 14px; letter-spacing: 1.5px; margin-bottom: 30px;">CORE CONTROLS (EQUALIZER)</h2>
            <div class="eq-grid">
                <div class="control-group">
                    <label>BASS <span id="bass-val">0 dB</span></label>
                    <input type="range" min="-15" max="15" value="0" id="bass-slider">
                </div>
                <div class="control-group">
                    <label>TREBLE <span id="treble-val">0 dB</span></label>
                    <input type="range" min="-15" max="15" value="0" id="treble-slider">
                </div>
                <div class="control-group">
                    <label>SPEED <span id="speed-val">1.0x</span></label>
                    <input type="range" min="0.5" max="2" value="1" step="0.1" id="speed-slider">
                </div>
            </div>
        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        const fileInput = document.getElementById('audio-upload');
        const uploadArea = document.querySelector('.upload-area');
        const audioPlayer = document.getElementById('audio-player');
        const playerContainer = document.getElementById('player-container');

        // Referensi Slider
        const bassSlider = document.getElementById('bass-slider');
        const trebleSlider = document.getElementById('treble-slider');
        const speedSlider = document.getElementById('speed-slider');

        // Variabel Web Audio API
        let audioCtx;
        let source;
        let bassFilter;
        let trebleFilter;

        // 1. Membuka File Explorer saat area ditekan
        uploadArea.addEventListener('click', () => fileInput.click());

        // 2. Menangkap file yang diunggah dan memutarnya
        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                // Membuat URL sementara di memori browser
                const fileURL = URL.createObjectURL(file);
                audioPlayer.src = fileURL;
                playerContainer.style.display = 'block';
                
                // Inisialisasi Audio API (hanya bisa jalan setelah ada interaksi pengguna)
                setupWebAudio();
            }
        });

        // 3. Menghubungkan Audio Player dengan Node Filter (Equalizer)
        function setupWebAudio() {
            if (!audioCtx) {
                // Membuat lingkungan audio
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Mengambil sumber suara dari tag <audio>
                source = audioCtx.createMediaElementSource(audioPlayer);
                
                // Membuat Filter Bass (Lowshelf)
                bassFilter = audioCtx.createBiquadFilter();
                bassFilter.type = 'lowshelf';
                bassFilter.frequency.value = 150; // Frekuensi rendah

                // Membuat Filter Treble (Highshelf)
                trebleFilter = audioCtx.createBiquadFilter();
                trebleFilter.type = 'highshelf';
                trebleFilter.frequency.value = 4000; // Frekuensi tinggi

                // Menyambungkan kabel virtual: Sumber -> Bass -> Treble -> Speaker
                source.connect(bassFilter);
                bassFilter.connect(trebleFilter);
                trebleFilter.connect(audioCtx.destination);
            }
        }

        // 4. Membaca perubahan pada Slider
        bassSlider.addEventListener('input', (e) => {
            if (bassFilter) bassFilter.gain.value = e.target.value;
            document.getElementById('bass-val').innerText = e.target.value + ' dB';
        });

        trebleSlider.addEventListener('input', (e) => {
            if (trebleFilter) trebleFilter.gain.value = e.target.value;
            document.getElementById('treble-val').innerText = e.target.value + ' dB';
        });

        speedSlider.addEventListener('input', (e) => {
            audioPlayer.playbackRate = e.target.value;
            document.getElementById('speed-val').innerText = e.target.value + 'x';
        });
    </script>
</body>
</html>
